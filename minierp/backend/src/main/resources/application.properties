spring.application.name=minierp-backend
server.port=8080

# --- Base de datos: H2 (por defecto) ---
# Se guarda en archivo (carpeta ./data), así los datos no se pierden al reiniciar.
# Para empezar desde cero, detén la app y borra la carpeta "data".
spring.datasource.url=jdbc:h2:file:./data/minierp
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/minierp · usuario: sa · contraseña vacía)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Aplicación ---
# Origen del frontend Next.js autorizado por CORS
app.cors.allowed-origins=http://localhost:3000
# Carga datos de ejemplo la primera vez (cuando no hay categorías)
app.seed.enabled=true

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
