# Perfil "prod": backend en Render + base de datos PostgreSQL en Supabase.
# Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod (ya está en el Dockerfile).
# Los datos sensibles NO van aquí: se leen de variables de entorno configuradas en Render.

# Render indica el puerto en la variable PORT
server.port=${PORT:8080}

# --- Supabase (Session pooler, puerto 5432) ---
# DB_URL      = jdbc:postgresql://aws-X-REGION.pooler.supabase.com:5432/postgres?sslmode=require
# DB_USERNAME = postgres.<project-ref>
# DB_PASSWORD = la contraseña de la base de datos que definiste al crear el proyecto
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# El plan gratuito de Supabase limita las conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=5

# Las tablas se crean en el esquema "minierp" (no en "public"),
# así no quedan expuestas por la API REST automática de Supabase.
spring.jpa.properties.hibernate.default_schema=minierp
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# CORS: se define con la variable de entorno APP_CORS_ALLOWED_ORIGINS en Render
# (ej: https://minierp.vercel.app,http://localhost:3000)
