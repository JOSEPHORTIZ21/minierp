# Opcional: levanta MySQL sin instalarlo. Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: minierp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: minierp
      TZ: America/Bogota
    ports:
      - "3306:3306"
    volumes:
      - minierp-data:/var/lib/mysql

volumes:
  minierp-data:
